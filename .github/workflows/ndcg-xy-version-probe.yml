name: ndcg-xy-version-probe
on:
  push:
    paths:
      - '.github/workflows/ndcg-xy-version-probe.yml'
      - 'ndcg_xy_version_probe.py'
  workflow_dispatch:

jobs:
  verify-version-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install exact release versions
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'lightgbm==4.6.0' 'xgboost==3.1.1'
          python -m pip freeze > dependency-versions.txt
      - name: Check empty-query and group-weight branches
        run: |
          python ndcg_xy_version_probe.py | tee ndcg-xy-release-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndcg-xy-version-probe-results
          path: |
            ndcg-xy-release-probe.csv
            ndcg-xy-release-probe.txt
            dependency-versions.txt
            ndcg_xy_version_probe.py
