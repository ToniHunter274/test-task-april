name: fleet-check

on:
  push:
    paths:
      - "tsp/run_fleet.py"
      - ".github/workflows/fleet-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # What each image installs today (the morning rebuild)
          - { label: py37, image: "python:3.7-slim", spec: "networkx" }
          - { label: py38, image: "python:3.8-slim", spec: "networkx" }
          - { label: py39, image: "python:3.9-slim", spec: "networkx" }
          - { label: py310, image: "python:3.10-slim", spec: "networkx" }
          - { label: py312, image: "python:3.12-slim", spec: "networkx" }
          # What a cached south layer on python:3.8 could hold
          - { label: py38-nx2.6.0, image: "python:3.8-slim", spec: "networkx==2.6.0" }
          - { label: py38-nx2.6.3, image: "python:3.8-slim", spec: "networkx==2.6.3" }
          - { label: py38-nx2.7.1, image: "python:3.8-slim", spec: "networkx==2.7.1" }
          - { label: py38-nx2.8.8, image: "python:3.8-slim", spec: "networkx==2.8.8" }
          - { label: py38-nx3.0, image: "python:3.8-slim", spec: "networkx==3.0" }
          # What an older hub build on python:3.9 could hold
          - { label: py39-nx2.6.3, image: "python:3.9-slim", spec: "networkx==2.6.3" }
          - { label: py39-nx2.7.1, image: "python:3.9-slim", spec: "networkx==2.7.1" }
          - { label: py39-nx2.8.8, image: "python:3.9-slim", spec: "networkx==2.8.8" }
          - { label: py312-nx3.1, image: "python:3.12-slim", spec: "networkx==3.1" }
          - { label: py312-nx3.2.1, image: "python:3.12-slim", spec: "networkx==3.2.1" }
          - { label: py312-nx3.3, image: "python:3.12-slim", spec: "networkx==3.3" }
          - { label: py312-nx3.4.2, image: "python:3.12-slim", spec: "networkx==3.4.2" }
          - { label: py312-nx3.5, image: "python:3.12-slim", spec: "networkx==3.5" }
          - { label: py312-nx3.6, image: "python:3.12-slim", spec: "networkx==3.6" }
    env:
      LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Install as the Dockerfile does
        run: |
          python --version
          pip --version
          pip install --no-cache-dir "${{ matrix.spec }}"
          pip show networkx
      - name: Run all regions
        working-directory: tsp
        run: python run_fleet.py
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-${{ matrix.label }}
          path: tsp/fleet_*.json

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true
      - name: Summarise and commit
        run: |
          rm -rf tsp/fleet_results
          mkdir -p tsp/fleet_results
          cp results/*.json tsp/fleet_results/
          python3 - <<'PY' | tee tsp/fleet_results/SUMMARY.md
          import glob, json
          rows = [json.load(open(p)) for p in sorted(glob.glob("tsp/fleet_results/fleet_*.json"))]
          regs = ["north", "west", "south", "east", "hub"]
          print("| run | python | networkx | " + " | ".join(regs) + " |")
          print("|---|---|---|" + "---|" * len(regs))
          for d in rows:
              r = d["regions"]
              cells = ["%s (%s km) %s" % (r[g]["planner_total"], r[g]["driven_km"], r[g]["loop"]) for g in regs]
              print("| %s | %s | %s | %s |" % (d["label"], d["python"], d["networkx"], " | ".join(cells)))
          print()
          print("Cells: planner total (driven km) loop")
          PY
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A tsp/fleet_results
          git commit -m "Fleet check results v5 (new south)" || echo "nothing to commit"
          git pull --rebase
          git push
