# Upload to .github/workflows/ndcg-release-crosscheck.yml
name: ndcg-release-crosscheck
on:
  workflow_dispatch:

jobs:
  compare-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned released libraries
        run: |
          python -m pip install --disable-pip-version-check "lightgbm==4.7.0" "xgboost==3.4.1" "numpy<3"
          python -m pip freeze | tee dependency-versions.txt
      - name: Evaluate same four queries in both libraries
        shell: bash
        run: |
          cat > ndcg_release_crosscheck.py <<'PYTHON'
          """Four-query released-version NDCG@3 reproducibility harness.
          
          This fixture was independently reconstructed to match previously reported
          six-decimal results; it is not claimed to be the original fixture.
          
          Expected released library versions in GitHub Actions:
            LightGBM 4.7.0; XGBoost 3.4.1
          It also runs locally on other installed versions to check historical behavior.
          
          Both libraries perform one fit/evaluation on constant features, with preassigned
          strictly decreasing prediction scores supplied via initial scores / base margins.
          No useful split is possible, so eval records the intended ranking.
          """
          from __future__ import annotations
          import sys
          from math import log2
          
          import lightgbm as lgb
          import numpy as np
          import xgboost as xgb
          
          QUERIES = [
              [0, 1],           # ndcg@3 = 0.630929753571...
              [3, 0, 2, 1],     # ndcg@3 = 0.904949505846...
              [0, 0, 0],        # zero ideal DCG: special query
              [2, 2, 0, 3],     # ndcg@3 = 0.470786921391...
          ]
          GROUP = [len(q) for q in QUERIES]
          LABELS = np.concatenate([np.asarray(q, dtype=np.float32) for q in QUERIES])
          RANK_SCORES = np.concatenate(
              [np.arange(len(q), 0, -1, dtype=np.float64) for q in QUERIES]
          )
          FEATURES = np.zeros((len(LABELS), 1), dtype=np.float64)
          
          
          def individual_ndcg(labels: list[int], k: int = 3) -> float:
              """Reference normalizer: exponential gain and log2 discount."""
              def dcg(rel):
                  return sum((2 ** r - 1) / log2(position + 2)
                             for position, r in enumerate(rel[:k]))
          
              best = dcg(sorted(labels, reverse=True))
              return dcg(labels) / best if best else 1.0
          
          
          PER_QUERY = np.asarray([individual_ndcg(q) for q in QUERIES])
          
          
          def check_lgb(weights: tuple[int, ...] | None) -> float:
              row_weights = None if weights is None else np.repeat(weights, GROUP)
              data = lgb.Dataset(
                  FEATURES, label=LABELS, group=GROUP, weight=row_weights,
                  init_score=RANK_SCORES, free_raw_data=False
              )
              history = {}
              lgb.train(
                  {
                      'objective': 'lambdarank', 'metric': 'ndcg', 'ndcg_eval_at': [3],
                      'min_data_in_leaf': 1000, 'num_leaves': 2,
                      'num_threads': 1, 'verbosity': -1, 'seed': 17,
                  },
                  data, num_boost_round=1,
                  valid_sets=[data], valid_names=['test'],
                  callbacks=[lgb.record_evaluation(history)],
              )
              return float(history['test']['ndcg@3'][-1])
          
          
          def check_xgb(weights: tuple[int, ...] | None) -> float:
              data = xgb.DMatrix(
                  FEATURES, label=LABELS, weight=weights, base_margin=RANK_SCORES
              )
              data.set_group(GROUP)
              hist = {}
              xgb.train(
                  {
                      'objective': 'rank:ndcg', 'eval_metric': 'ndcg@3',
                      'tree_method': 'hist', 'min_child_weight': 100000,
                      'max_depth': 1, 'nthread': 1, 'verbosity': 0,
                  },
                  data, num_boost_round=1, evals=[(data, 'test')],
                  evals_result=hist, verbose_eval=False,
              )
              return float(hist['test']['ndcg@3'][-1])
          
          
          def expected_release(weights: tuple[int, ...] | None) -> float:
              w = np.ones(4) if weights is None else np.asarray(weights, dtype=float)
              # Both released implementations give a *flat* 1 to the empty query #3,
              # rather than weight[2] * 1. They nevertheless include weight[2]
              # in the denominator.
              return float((w[0] * PER_QUERY[0] + w[1] * PER_QUERY[1]
                            + 1 + w[3] * PER_QUERY[3]) / w.sum())
          
          
          def normally_weighted(weights: tuple[int, ...] | None) -> float:
              return float(np.average(PER_QUERY, weights=weights))
          
          
          print(f'Python {sys.version.split()[0]}')
          print(f'LightGBM {lgb.__version__} | XGBoost {xgb.__version__} | NumPy {np.__version__}')
          print('Group lengths:', GROUP)
          print('Labels:', [list(q) for q in QUERIES])
          print('Per-query NDCG@3:', ', '.join(f'{v:.12f}' for v in PER_QUERY))
          print('   Query weights    LightGBM     XGBoost   release branch   usual weighted')
          for weights in (None, (1, 1, 3, 2), (1, 1, 1, 2), (1, 1, 10, 2)):
              actual_l = check_lgb(weights)
              actual_x = check_xgb(weights)
              expected = expected_release(weights)
              normal = normally_weighted(weights)
              print(f'{str(weights):>20} {actual_l:12.6f} {actual_x:12.6f}'
                    f' {expected:16.6f} {normal:16.6f}')
              for implementation, result in [('LightGBM', actual_l), ('XGBoost', actual_x)]:
                  assert abs(result - expected) < 1e-6, (implementation, weights, result, expected)
          print('ALL RELEASE-BEHAVIOR ASSERTIONS PASSED')
          PYTHON
          python ndcg_release_crosscheck.py | tee ndcg-results.txt
      - name: Archive exact runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: ndcg-crosscheck-results
          path: |
            ndcg-results.txt
            dependency-versions.txt
            ndcg_release_crosscheck.py
