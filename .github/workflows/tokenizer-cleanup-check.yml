name: tokenizer-cleanup-check
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/tokenizer-cleanup-check.yml
      - tokenizer_cleanup_check.py
      - tokenizer_cleanup_summarize.py

jobs:
  tokenizer-cleanup:
    name: transformers ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        version:
          # Databricks ML 14.3, 15.4, 16.4, 17.3, 18, 19
          - '4.36.1'
          - '4.41.2'
          - '4.50.2'
          - '4.51.3'
          - '4.57.1'
          - '4.57.6'
          # Pre-change control and exact patch boundary
          - '4.44.2'
          - '4.45.0'
          - '4.45.1'
          # Latest as of 2026-11-23 (verified from PyPI)
          - '5.24.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install version-pinned Transformers, with isolated failure reporting
        id: install
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check \
            "transformers==${{ matrix.version }}" \
            "sentencepiece>=0.1.99,<0.3" \
            "numpy<2" \
            > install-log.txt 2>&1
          cat install-log.txt
      - name: Run all eight public tokenizers
        if: always()
        env:
          MATRIX_VERSION: ${{ matrix.version }}
          RESULT_FILE: results.jsonl
          HF_HUB_DOWNLOAD_TIMEOUT: '40'
          HF_HUB_ETAG_TIMEOUT: '40'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python tokenizer_cleanup_check.py > run-log.txt 2>&1 || true
          cat run-log.txt
          python -m pip freeze > dependencies.txt
      - name: Save outcome (including failed installs and model downloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer-cleanup-${{ matrix.version }}
          path: |
            results.jsonl
            run-log.txt
            install-log.txt
            dependencies.txt
          if-no-files-found: warn

  summarize:
    name: Consolidate all version results
    needs: tokenizer-cleanup
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Collect version artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tokenizer-cleanup-*
          path: matrix-artifacts
          merge-multiple: false
      - name: Generate matrix CSV and delta report
        run: |
          python tokenizer_cleanup_summarize.py matrix-artifacts | tee tokenizer-cleanup-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tokenizer-cleanup-consolidated
          path: |
            tokenizer-cleanup-matrix.csv
            tokenizer-cleanup-summary.txt
